name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: TMI check (public docs leak scan)
        run: |
          curl -sfL https://raw.githubusercontent.com/quismon/quismon/main/scripts/tmi_check.py -o /tmp/tmi_check.py
          python3 /tmp/tmi_check.py "$GITHUB_WORKSPACE"

      - name: Set up Terraform (tfplugindocs uses PATH; hc-install downloads fail on expired keys)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Generate Documentation
        run: |
          go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.20.0
          tfplugindocs generate --provider-name quismon


      # NOTE: docs must be committed and pushed BEFORE tagging (tfplugindocs
      # output committed locally). Committing inside this workflow moves the
      # tag and goreleaser aborts with "tag was not made against commit".
      - name: Verify docs are up to date
        # Advisory: tfplugindocs version drift between local and CI renders
        # can false-positive this check; release proceeds, diffs stay visible
        # in the step log. The tree is restored afterwards: goreleaser
        # refuses to run on a dirty git state.
        continue-on-error: true
        run: |
          GOBIN=$(go env GOPATH)/bin go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.20.0
          tfplugindocs generate --provider-name quismon
          git diff --quiet docs/ || { echo "::warning::docs/ out of date - run tfplugindocs generate locally and commit"; git diff --name-only docs/; }
          git checkout -- docs/ 2>/dev/null || true
          git clean -fd docs/ 2>/dev/null || true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
